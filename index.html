Html<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profil Fachri Ahmad</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">

  <!-- Container -->
  <div class="max-w-md mx-auto mt-10 bg-white rounded-xl shadow-lg overflow-hidden">
    <!-- Foto Profil -->
    <div class="flex justify-center mt-6">
      <img class="w-32 h-32 rounded-full border-4 border-blue-500 object-cover"
           src="https://via.placeholder.com/150"
           alt="Foto Fachri Ahmad">
    </div>

    <!-- Informasi Profil -->
    <div class="p-6 text-center">
      <h1 class="text-2xl font-bold text-gray-800">Fachri Ahmad</h1>
      <p class="text-gray-600 mt-2">Web Developer | UI/UX Enthusiast</p>

      <!-- Bio -->
      <p class="mt-4 text-gray-700 text-sm leading-relaxed">
        Seorang pengembang web yang berfokus pada pembuatan website modern, responsif, 
        dan ramah pengguna. Memiliki minat besar pada desain antarmuka dan pengalaman pengguna.
      </p>

      <!-- Tombol Sosial -->
      <div class="mt-6 flex justify-center space-x-4">
        <a href="https://github.com/" target="_blank"
           class="px-4 py-2 bg-gray-800 text-white rounded-lg hover:bg-gray-700 transition">
          GitHub
        </a>
        <a href="https://linkedin.com/" target="_blank"
           class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-500 transition">
          LinkedIn
        </a>
      </div>
    </div>
  </div>

</body>
</html>
